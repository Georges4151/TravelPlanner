server:
  port: 8080

spring:
  application:
    name: travel-planner
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/travel_planner?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectionCollation=utf8mb4_unicode_ci
    username: root
    password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    charset: UTF-8
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.travelplanner.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

travel:
  deepseek:
    # 请填入自己的 Key，或通过环境变量 DEEPSEEK_API_KEY 注入
    api-key: ${DEEPSEEK_API_KEY:sk-xxxxxxxxxxxxxxxxxxxxxxxx}
    api-url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
  qweather:
    # 和风天气 Key，或通过环境变量 QWEATHER_API_KEY 注入
    api-key: ${QWEATHER_API_KEY:your-qweather-key}
    api-url: https://devapi.qweather.com/v7
  amap:
    # 高德开放平台 Web 服务 Key，或通过环境变量 AMAP_API_KEY 注入
    api-key: ${AMAP_API_KEY:your-amap-key}
    api-url: https://restapi.amap.com/v3
